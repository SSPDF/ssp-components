name: CI

# Portão de qualidade dos PRs. Antes da Etapa 0 não existia nenhum workflow de PR:
# o único workflow do repo publicava no npm a cada push na main.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Typecheck, build e stories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # npm ci (e não npm install) para o lockfile valer de verdade.
      - name: Instalando dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Testes
        run: npm run test

      - name: Build da lib
        run: npm run build

      - name: Conferindo a API pública do dist
        run: node scripts/check-public-api.mjs

      - name: Conferindo o pacote publicável (publint + attw)
        run: npm run check:package

      # Instala o dist/ empacotado no examples/smoke-app, como um app instalaria, e
      # roda o `next build` (que faz SSR da página). É o único passo que exercita o
      # cenário real "o MUI vem do app".
      - name: App de fumaça (tarball + next build)
        run: npm run smoke

      # A peer `next` é `^14 || ^15 || ^16`: o passo acima testa o piso (14, o do
      # package.json do smoke-app) e este o topo, que é o que os apps usam.
      - name: App de fumaça com Next 16
        run: SMOKE_NEXT=16 npm run smoke

      # O topo das outras faixas abertas na 0.3.2 (`x-date-pickers ^6 || ^7`, `react-toastify
      # ^10 || ^11`), na combinação que o copom usa: MUI 5.18 + pickers 7 + toastify 11 + Next 16.
      - name: App de fumaça na combinação do copom (pickers 7, toastify 11, Next 16)
        run: SMOKE_NEXT=16 SMOKE_PICKERS=7 SMOKE_TOASTIFY=11 npm run smoke

      # Versão de desenvolvimento sem npm: o mesmo .tgz que o publish geraria (pack:local
      # repete os passos do publish.yaml). Só sobe se o check:package e os três smokes
      # passaram. No app: baixar o artefato do run e `npm install ./<arquivo>.tgz`.
      # O nome leva o SHA do topo do branch: num PR o `github.sha` é o commit de merge
      # temporário que o GitHub cria (e que ninguém acha no `git log`). O conteúdo é o
      # desse merge com a main — igual ao do topo enquanto o branch estiver atualizado.
      - name: Empacotando o dist/ (tarball de desenvolvimento)
        id: pack
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          npm run pack:local
          echo "name=ssplib-react-components-$(node -p "require('./lib-package.json').version")-${SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Publicando o tarball como artefato do run
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.name }}
          path: pack/*.tgz
          if-no-files-found: error
          retention-days: 30

      - name: Build do Storybook
        run: npm run build-storybook

      # A MESMA imagem do scripts/snapshots-in-docker.sh. Se divergirem, o baseline
      # gerado localmente não bate com o do CI e todo PR vira um diff de 77 imagens.
      # O mesmo passo roda as `play` functions das stories com a tag `interacao`.
      - name: Snapshots visuais e stories de interação
        run: |
          docker run --rm \
            -v "$PWD":/work -w /work --ipc=host \
            mcr.microsoft.com/playwright:v1.63.0-noble \
            node scripts/visual-snapshots.mjs

      - name: Publicando os diffs visuais
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diffs-visuais
          path: snapshots/__diff__/
          if-no-files-found: ignore
